# 맥 오디오 설정 — 기술팀이 설치할 때 채우는 파일
#
# 1. 이 파일을 복사해 Pi에 둔다. (예: /etc/maek-audio/maek_audio.ini)
# 2. 빈 칸(= 뒤가 비어 있는 줄)을 실제 값으로 채운다. 「필수」는 비우면 실행되지 않는다.
# 3. 확인:  python -m maek_audio.check /etc/maek-audio/maek_audio.ini
#    녹음한 원본이 있으면:  python -m maek_audio.check 설정.ini --pcm 녹음.raw --out 확인.wav
# 4. 코드에서:  settings = load_settings("/etc/maek-audio/maek_audio.ini")
#    경로를 주지 않으면 환경변수 MAEK_AUDIO_CONFIG, 그다음 현재 폴더의 maek_audio.ini 를 읽는다.
#
# # 로 시작하는 줄은 설명이다. 값 옆에 설명을 달 때도 # 를 쓴다.


[input]
# 라즈베리파이가 내보내는 마이크 PCM

# 필수. 샘플레이트(Hz). 예: 48000
sample_rate_hz =

# 필수. 샘플 형식. 아래 중 하나:
#   s16le     16-bit 정수
#   s24le     24-bit 정수, 3바이트에 꽉 채움(packed)
#   s24_32le  24-bit 정수가 32-bit 칸의 아래쪽 24비트에 들어감 (ALSA S24_LE)
#   s32le     32-bit 정수 (24-bit가 32-bit 칸의 위쪽에 들어간 경우도 이것)
#   float32le 32-bit 실수, -1…1
# 모두 little-endian, 채널이 프레임마다 번갈아 들어오는(interleaved) 형식이다.
sample_format =

# 필수. 한 프레임 안의 채널 순서. left, center, right 를 한 번씩, 쉼표로 구분.
channel_order = left, center, right

# 한 번에 처리하는 프레임 수. 비우면 sample_rate_hz / 100 (10ms).
frames_per_block =

# 세 채널이 같은 클럭으로 동시에 샘플링되면 true. 확인 전에는 false.
# false 이면 방향 각도(direction_deg)를 계산하지 않는다.
channels_synchronized = false


[mic_positions_m]
# 세 마이크 중심 좌표. 기구 앞이 +y, 오른쪽이 +x, 단위 m. 「x, y」 형식.
# 셋 다 채우거나 셋 다 비운다. 비우면 방향 각도를 계산하지 않는다.
# 예: left = -0.10, 0.00
left =
center =
right =


[speaker]
# 스피커 앰프 쪽으로 내보내는 2채널 PCM (왼쪽, 오른쪽 순서)

# 샘플 형식: s16le, s24le, s32le, float32le 중 하나. 비우면 입력과 같은 형식(가능할 때).
sample_format =

# 샘플레이트(Hz). 비우면 입력과 같다. 다르게 적으면 실행되지 않는다(리샘플링은 아직 없음).
sample_rate_hz =


[motor]
# 진동 모터 드라이버에 주는 명령값. 처리 결과의 0–1 강도를 이 범위로 바꾼다.

# 강도 0 일 때 보낼 값과 강도 1 일 때 보낼 값. 예: PWM duty 0–255 이면 0, 255
command_min = 0
command_max = 255

# 이 값보다 약한 강도는 0(command_min)으로 보낸다. 0–1. 모터가 떨기만 하고 안 돌 때 올린다.
deadzone = 0.0

# 드라이버 갱신 주기(Hz). 기록용. 이 모듈은 블록마다 값을 내므로 호출하는 쪽이 이 주기에 맞춰 보낸다.
update_hz =


[server]
# 원본 1초 WAV를 받는 심 서버. 현재 이 모듈은 전송하지 않는다.
# 여기 적은 값은 settings.server 로 읽을 수 있고, 전송 코드를 붙일 때 쓴다.
upload_url =
method = POST
# 서버가 요구하는 기기 이름 등. 비워도 된다.
device_id =


[tuning]
# 소리·진동 조정값. 현장에서 듣고 느끼며 바꾼다. 비우면 기본값을 쓴다.

# 스피커 음량 배율. 기본 0.5 (원음의 절반 크기, 약 -6dB).
output_gain =
# 대역 강조 비율 0–1. 0 이면 원음 그대로, 1 이면 band 범위만 남김. 기본 0.25.
processed_mix =
# 강조하는 대역(Hz). 기본 120 – 2800.
band_low_hz =
band_high_hz =
# 스피커 최대 크기 0–1. 이보다 큰 소리는 부드럽게 눌린다. 기본 0.8.
output_peak_limit =

# 진동이 시작되는 소리 크기와 최대가 되는 소리 크기(RMS). 기본 0.005, 0.08.
haptic_floor_rms =
haptic_full_rms =
# 중앙 마이크가 양쪽 진동에 보태는 비율. 기본 0.3.
haptic_center_mix =
# 좌우 차이를 키우는 배율. 기본 1.5.
haptic_side_boost =
# 진동이 올라가는/내려가는 속도(초). 기본 0.04, 0.20.
haptic_attack_s =
haptic_release_s =
# 기구가 움직이는 중 / 모터 작동 중일 때 진동을 줄이는 배율. 기본 0.5, 0.7.
motion_haptic_multiplier =
motor_haptic_multiplier =
