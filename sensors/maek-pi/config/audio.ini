[input]
sample_rate_hz = 44100
sample_format = s16le
# Physical placement is assumed: pin 8=left, pin 6=center, pin 9=right.
channel_order = left, center, right
frames_per_block = 128
# Direction estimation remains disabled until placement/calibration is verified.
channels_synchronized = false

[mic_positions_m]
left =
center =
right =

[speaker]
sample_format = s16le
sample_rate_hz = 44100

[motor]
command_min = 0
command_max = 255
deadzone = 0

[server]
upload_url =
method = POST
device_id = mic-001

[tuning]
# Start quietly: the unresolved MS3625 noise is NOT corrected by this setting.
output_gain = 0.1
processed_mix = 0.25
output_peak_limit = 0.5
band_low_hz = 120
band_high_hz = 2800
# 2026-11-15: vibration curve — react to sound relative to each mic's own background,
# so a quiet far sound and a loud near sound feel similar (memo: 12일 테스트).
haptic_relative = 1
haptic_margin_db = 4
haptic_range_db = 8
